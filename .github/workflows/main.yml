name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fastapi-product-catalog
  ECS_CLUSTER: fastapi-product-catalog-prod-cluster
  ECS_SERVICE: fastapi-product-catalog-prod-service

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Tests
        run: |
          pytest -v tests/

  build-and-push:
    name: Build & Push Docker Image to ECR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build and validate multi-stage Docker image locally on the runner
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REPOSITORY:latest .

      - name: Validate IAM Role ARN Format
        if: env.AWS_ROLE_TO_ASSUME != ''
        env:
          ROLE_TO_CHECK: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [[ "$ROLE_TO_CHECK" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "Role ARN format is valid."
          else
            echo "::error title=Malformed AWS_ROLE_TO_ASSUME::The AWS_ROLE_TO_ASSUME secret must be a full IAM role ARN matching 'arn:aws:iam::<12-digit-account-id>:role/<role-name>'. Received: '$ROLE_TO_CHECK'. Please update your GitHub Secret to the full ARN."
            exit 1
          fi

      - name: Inspect GitHub OIDC Token Claims (Diagnostic)
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          echo "Inspecting GitHub OIDC token claims for AWS STS..."
          TOKEN_RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          python -c "
          import sys, json, base64
          try:
              data = json.loads(sys.argv[1])
              jwt = data.get('value', '')
              parts = jwt.split('.')
              if len(parts) >= 2:
                  payload = json.loads(base64.urlsafe_b64decode(parts[1] + '===').decode('utf-8'))
                  print('=== GITHUB ACTIONS OIDC CLAIMS ===')
                  print('Issuer (iss):', payload.get('iss'))
                  print('Audience (aud):', payload.get('aud'))
                  print('Subject (sub):', payload.get('sub'))
                  print('Repository:', payload.get('repository'))
                  print('Ref:', payload.get('ref'))
                  print('==================================')
          except Exception as e:
              print('Could not decode diagnostic token:', e)
          " "$TOKEN_RESP"

      # Preferred Authentication: GitHub OIDC (Role Assumption without long-lived keys)
      - name: Configure AWS Credentials (OIDC)
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # Alternative Authentication: Static IAM User Access Keys
      - name: Configure AWS Credentials (Access Keys)
        if: env.AWS_ROLE_TO_ASSUME == '' && env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS Authentication Setup
        if: env.AWS_ROLE_TO_ASSUME == '' && env.AWS_ACCESS_KEY_ID == ''
        run: |
          echo "::error title=Missing AWS Credentials::No AWS authentication configured. Please add either AWS_ROLE_TO_ASSUME (for GitHub OIDC) or AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to GitHub Repository Secrets."
          exit 1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        run: |
          echo "Checking if ECR repository '$ECR_REPOSITORY' exists..."
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region ${{ env.AWS_REGION }} >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name $ECR_REPOSITORY --region ${{ env.AWS_REGION }} || true

      - name: Tag and Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Tag Docker images with ECR repository registry
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REPOSITORY:latest $REGISTRY/$ECR_REPOSITORY:latest
          
          # Push commit SHA and latest tags to Amazon ECR
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to AWS ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      # Preferred Authentication: GitHub OIDC
      - name: Configure AWS Credentials (OIDC)
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # Alternative Authentication: Static IAM User Access Keys
      - name: Configure AWS Credentials (Access Keys)
        if: env.AWS_ROLE_TO_ASSUME == '' && env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ECS Rolling Deployment
        run: |
          echo "Checking ECS cluster and service status..."
          if aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --region ${{ env.AWS_REGION }} --query 'services[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "Updating ECS service $ECS_SERVICE in cluster $ECS_CLUSTER..."
            aws ecs update-service \
              --cluster $ECS_CLUSTER \
              --service $ECS_SERVICE \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
            echo "ECS service update triggered successfully."
          else
            echo "::warning::ECS Service '$ECS_SERVICE' in cluster '$ECS_CLUSTER' is not active yet. Skipping service rollout until ECS infrastructure is created."
          fi
