version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: product_catalog_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product_catalog_api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/product_catalog
      - APP_ENV=development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -c '
      import time, os, psycopg2
      url = os.getenv(\"DATABASE_URL\")
      for i in range(30):
          try:
              conn = psycopg2.connect(url)
              conn.close()
              print(\"PostgreSQL is ready and accepting connections!\")
              break
          except Exception as e:
              print(f\"Waiting for database readiness... attempt {i+1}/30\")
              time.sleep(1)
      ' && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
